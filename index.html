<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QTS Assessor Companion</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,sans-serif;color:#233246;background:#f4f7fa}*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:0;border-radius:9px;padding:10px 14px;background:#143d59;color:white}button.secondary{background:#e8eff5;color:#173b54}button:disabled{opacity:.45}input,select,textarea{width:100%;border:1px solid #cbd7df;border-radius:9px;padding:10px;background:white;color:#233246}textarea{min-height:90px}label{display:block;font-size:13px;font-weight:650;margin:12px 0 5px}header{background:#11364f;color:white;padding:17px 24px;display:flex;justify-content:space-between;gap:12px;align-items:center}header small{display:block;color:#b7d0e0;margin-top:4px}nav{background:white;border-bottom:1px solid #dce5eb;padding:12px 24px;display:flex;gap:8px;flex-wrap:wrap}nav button{background:transparent;color:#4b6576}nav button.active{background:#dcebf3;color:#103e58}main{max-width:1190px;margin:28px auto;padding:0 18px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(245px,1fr));gap:15px}.card{background:white;border:1px solid #e0e8ed;border-radius:15px;padding:20px;box-shadow:0 3px 12px #17384d08}.card h3{margin:0 0 10px}.muted{color:#637887;font-size:13px}.pill{font-size:12px;background:#e9f2f7;border-radius:99px;padding:5px 10px;display:inline-block}.danger{color:#a24736}.good{color:#17684c}.row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.stack{display:grid;gap:12px}.two{display:grid;grid-template-columns:1fr 1fr;gap:18px}.progress{height:9px;background:#e5ecf1;border-radius:12px;overflow:hidden}.progress span{display:block;background:#3a8f87;height:100%}a{color:#176a96}h1{font-size:29px;margin:0 0 6px}h2{font-size:20px;margin:0 0 14px}p{line-height:1.5}.step{border-left:3px solid #9bbac9;padding:8px 0 8px 18px;margin:12px 0}.step.current{border-color:#147e83;background:#f2f8f8}.check{display:flex;gap:10px;align-items:start;margin:11px const STAGES=[{name:'Eligibility & application',desc:'Confirm Sunderland has checked eligibility, qualifications, experience and suitability before admission.',items:['Provider confirms eligibility and entry checks','Experience, age phase and school settings verified by provider','Safeguarding and suitability checks confirmed by provider','Interview arranged or completed'],questions:['What age ranges and school contexts have you taught?','Which current teaching responsibilities demonstrate readiness?']},{name:'Interview & initial evidence',desc:'Review existing teaching practice and the initial evidence base. Follow the provider’s current interview instructions.',items:['Interview record completed','Initial evidence against all standards reviewed','Any gaps documented','Provider authorises progression'],questions:['Which examples best demonstrate impact on pupil learning?','How have you adapted your practice following assessment?']},{name:'Registration & launch',desc:'Record the official assessment start and agree practical arrangements. Do not begin the formal period without provider confirmation.',items:['Provider confirms registration and official start date','School mentor and responsibilities confirmed','Assessment schedule agreed','Candidate understands evidence expectations and safeguarding'],questions:['Who will arrange access to lessons and evidence?','How will candidate and assessor communicate during the period?']},{name:'Practical assessment',desc:'Observe current teaching, verify the evidence, discuss professional judgement and review coverage of the Teachers’ Standards.',items:['Practical teaching assessment recorded','Professional discussions and mentor evidence reviewed','All standards considered using current practice','Any concerns and evidence gaps addressed'],questions:['What did pupils learn and how do you know?','What would you change in this lesson and why?','How do you meet the needs of pupils with SEND and EAL?']},{name:'Final review & QA',d
